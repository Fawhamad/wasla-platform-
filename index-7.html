<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WASLA | وصلة - منصة التوزيع الغذائي</title>
<style>
:root{--navy:#153b55;--blue:#1e6a91;--orange:#f29a38;--bg:#f4f7fa;--ink:#183244;--muted:#6d8291;--line:#e2eaf0;--green:#23845b;--red:#b64a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--navy);color:white}
button.secondary{background:#eaf1f5;color:var(--navy)}button.orange{background:var(--orange);color:#36220b}
header{background:linear-gradient(115deg,#153b55,#1f6381);color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.logo{font-size:26px;font-weight:bold;letter-spacing:1px}.logo small{display:block;font-size:12px;font-weight:normal;color:#d8e8f0;letter-spacing:0}
.topmeta{font-size:13px;color:#d8e8f0}.wrap{max-width:1200px;margin:22px auto;padding:0 16px}
.layout{display:grid;grid-template-columns:220px 1fr;gap:18px}.side,.panel,.card{background:white;border:1px solid var(--line);border-radius:16px}
.side{padding:12px;height:max-content;position:sticky;top:12px}.side button{display:block;width:100%;text-align:right;background:transparent;color:var(--ink);margin:3px 0}.side button.active,.side button:hover{background:#eaf3f8;color:var(--navy)}
main{min-width:0}.welcome{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.welcome h1{font-size:23px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{padding:16px}.stat strong{display:block;font-size:25px;color:var(--navy);margin-top:8px}
.panel{padding:18px;margin-bottom:16px}.panel h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.product{border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:8px}.product .emoji{font-size:34px;background:#f2f6f8;border-radius:10px;padding:12px;text-align:center}.product h3{margin:0;font-size:15px}.price{font-weight:bold;color:var(--green)}.product small{color:var(--muted)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;flex:1;min-width:130px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{border:1px solid #d8e2e9;border-radius:9px;padding:10px;background:white;color:var(--ink);width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:11px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:normal;background:#f8fafb}
.pill{display:inline-block;border-radius:30px;padding:4px 9px;background:#edf4f7;color:#28566e;font-size:11px}.empty{padding:25px;text-align:center;color:var(--muted)}
.hidden{display:none!important}.login{max-width:460px;margin:50px auto;padding:25px}.login h1{margin-top:0}.notice{background:#fff6e9;border:1px solid #f6dfbd;color:#77501d;padding:12px;border-radius:10px;font-size:12px;line-height:1.8;margin-top:12px}
.toast{position:fixed;bottom:20px;left:20px;background:#173f56;color:white;padding:12px 18px;border-radius:10px;display:none;z-index:9}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px}.side button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.panel{padding:13px}table{font-size:11px}th,td{padding:8px 4px}}
</style></head>
<body>
<header><div class="logo">WASLA <small>وصلة من المصنع للتاجر</small></div><div class="topmeta" id="headerUser">منصة التوزيع الغذائي B2B</div><button class="secondary" id="logoutBtn" onclick="logout()" style="display:none">تسجيل الخروج</button></header>
<div class="wrap">
<section id="loginView" class="panel login">
<h1>مرحبًا بك في وصلة</h1><p class="muted">اختر نوع الحساب للدخول إلى النسخة التجريبية.</p>
<div class="field"><label>نوع الحساب</label><select id="loginRole"><option value="retailer">محل تجزئة</option><option value="supplier">شركة مصنعة</option><option value="admin">إدارة المنصة</option></select></div>
<div class="field"><label>اسم المستخدم / اسم النشاط</label><input id="loginName" value="ماركت أحمد" placeholder="اكتب اسمك أو نشاطك"></div>
<button onclick="login()" style="width:100%">دخول إلى المنصة</button>
<div class="notice">هذه نسخة تجريبية محلية: لا تستخدم كلمات مرور حقيقية أو بيانات عملاء فعلية. الحسابات والطلبات تحفظ على نفس المتصفح فقط.</div>
</section>
<section id="appView" class="hidden">
<div class="layout">
<nav class="side" id="nav"></nav>
<main>
<div class="welcome"><div><h1 id="pageTitle">لوحة التحكم</h1><div class="muted" id="pageSubtitle">نظرة عامة على نشاطك</div></div><span class="pill" id="rolePill"></span></div>
<div id="content"></div>
</main></div></section>
</div><div class="toast" id="toast"></div>
<script>
const seedProducts=[
{id:1,name:"زيت عباد الشمس 1 لتر",brand:"شركة النور",category:"زيوت وسمن",price:620,unit:"كرتونة / 12 عبوة",stock:40,emoji:"🫒"},
{id:2,name:"مكرونة 400 جم",brand:"مصانع الأهرام",category:"مكرونة وأرز",price:180,unit:"كرتونة / 20 عبوة",stock:75,emoji:"🍝"},
{id:3,name:"شاي 250 جم",brand:"شركة النور",category:"شاي وسكر",price:390,unit:"كرتونة / 12 عبوة",stock:22,emoji:"🍵"},
{id:4,name:"بسكويت سادة",brand:"مصانع الأهرام",category:"بسكويت وسناكس",price:240,unit:"كرتونة / 24 عبوة",stock:50,emoji:"🍪"},
{id:5,name:"أرز 1 كجم",brand:"شركة النور",category:"مكرونة وأرز",price:510,unit:"كرتونة / 10 عبوات",stock:30,emoji:"🍚"},
{id:6,name:"عصير مانجو",brand:"مصانع الأهرام",category:"مشروبات",price:300,unit:"كرتونة / 24 عبوة",stock:18,emoji:"🧃"}
];
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem("wasla_"+k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem("wasla_"+k,JSON.stringify(v));
let products=read("products",seedProducts),orders=read("orders",[]),user=null,cart=[],page="home";
const roles={admin:"مدير المنصة",supplier:"الشركة المصنعة",retailer:"محل تجزئة"};
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2300)}
function login(){let role=document.getElementById("loginRole").value,name=document.getElementById("loginName").value.trim()||roles[role];user={role,name};document.getElementById("loginView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");document.getElementById("logoutBtn").style.display="block";document.getElementById("headerUser").textContent=name;document.getElementById("rolePill").textContent=roles[role];page="home";render()}
function logout(){user=null;cart=[];document.getElementById("appView").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden");document.getElementById("logoutBtn").style.display="none";document.getElementById("headerUser").textContent="منصة التوزيع الغذائي B2B"}
function go(p){page=p;render()}
function money(n){return Number(n).toLocaleString("en-US")+" ج.م"}
function navItems(){let a=[["home","نظرة عامة","⌂"]];if(user.role==="retailer")a.push(["shop","تصفح المنتجات","▦"],["cart","سلة المشتريات","🛒"],["myorders","طلباتي","▤"]);if(user.role==="supplier")a.push(["products","منتجاتي","▦"],["supplierorders","طلبات العملاء","▤"]);if(user.role==="admin")a.push(["orders","كل الطلبات","▤"],["products","إدارة المنتجات","▦"],["users","المستخدمون","♙"]);return a}
function render(){document.getElementById("nav").innerHTML=navItems().map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[2]}　${x[1]}</button>`).join("");let titles={home:"لوحة التحكم",shop:"كتالوج المنتجات",cart:"سلة المشتريات",myorders:"طلباتي",products:"إدارة المنتجات",supplierorders:"طلبات العملاء",orders:"إدارة الطلبات",users:"المستخدمون"};document.getElementById("pageTitle").textContent=titles[page]||"وصلة";document.getElementById("pageSubtitle").textContent=user.name+" · "+roles[user.role];let c=document.getElementById("content");if(page==="home")c.innerHTML=home();if(page==="shop")c.innerHTML=shop();if(page==="cart")c.innerHTML=cartView();if(page==="myorders")c.innerHTML=ordersTable(orders.filter(o=>o.customer===user.name));if(page==="orders")c.innerHTML=ordersTable(orders);if(page==="supplierorders")c.innerHTML=ordersTable(orders);if(page==="products")c.innerHTML=productsView();if(page==="users")c.innerHTML=usersView()}
function home(){let my=orders.filter(o=>user.role==="admin"||o.customer===user.name);let count=orders.length;return `<div class="stats"><div class="card stat"><span class="muted">إجمالي المنتجات</span><strong>${products.length}</strong></div><div class="card stat"><span class="muted">إجمالي الطلبات</span><strong>${count}</strong></div><div class="card stat"><span class="muted">طلبات جديدة</span><strong>${orders.filter(o=>o.status==="جديد").length}</strong></div><div class="card stat"><span class="muted">قيمة الطلبات</span><strong>${money(orders.reduce((s,o)=>s+o.total,0))}</strong></div></div><div class="panel"><h2>مرحبًا في WASLA</h2><p class="muted">منصة تربط الشركات المصنعة بمحلات التجزئة وتدير الطلبات والتوزيع من مكان واحد.</p><div class="row">${user.role==="retailer"?'<button onclick="go(\\'shop\\')">ابدأ التسوق</button>':''}${user.role==="admin"?'<button onclick="go(\\'products\\')">إدارة الكتالوج</button><button class="secondary" onclick="go(\\'orders\\')">متابعة الطلبات</button>':''}${user.role==="supplier"?'<button onclick="go(\\'products\\')">إدارة المنتجات</button><button class="secondary" onclick="go(\\'supplierorders\\')">طلبات العملاء</button>':''}</div></div><div class="panel"><h2>آخر الطلبات</h2>${orders.length?ordersTable(orders.slice(-5).reverse(),false):'<div class="empty">لا توجد طلبات حتى الآن</div>'}</div>`}
function shop(){return `<div class="panel"><div class="row between"><h2>المنتجات المتاحة</h2><input style="max-width:230px" placeholder="ابحث عن منتج..." oninput="filterProducts(this.value)"></div><div class="grid" id="productGrid">${productCards(products,true)}</div></div>`}
function productCards(arr,add){return arr.map(p=>`<div class="product"><div class="emoji">${p.emoji||"📦"}</div><h3>${p.name}</h3><small>${p.brand} · ${p.category}</small><div class="price">${money(p.price)}</div><small>${p.unit} · المتاح: ${p.stock}</small>${add?`<div class="row"><input id="qty${p.id}" type="number" min="1" value="1" style="width:75px"><button onclick="addCart(${p.id})">أضف للسلة</button></div>`:""}</div>`).join("")||'<div class="empty">لا توجد منتجات</div>'}
function filterProducts(q){document.getElementById("productGrid").innerHTML=productCards(products.filter(p=>(p.name+p.brand+p.category).includes(q)),true)}
function addCart(id){let p=products.find(x=>x.id===id),q=Math.max(1,Number(document.getElementById("qty"+id).value)||1),x=cart.find(x=>x.id===id);if(x)x.qty+=q;else cart.push({id,qty:q});toast("تمت إضافة المنتج للسلة")}
function cartView(){let items=cart.map(x=>({...products.find(p=>p.id===x.id),qty:x.qty})).filter(x=>x.id);let total=items.reduce((s,x)=>s+x.price*x.qty,0);return `<div class="panel"><h2>مراجعة الطلب</h2>${items.length?`<table><thead><tr><th>المنتج</th><th>سعر الوحدة</th><th>الكمية</th><th>الإجمالي</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.name}</td><td>${money(x.price)}</td><td>${x.qty}</td><td>${money(x.price*x.qty)}</td><td><button class="secondary" onclick="removeCart(${x.id})">حذف</button></td></tr>`).join("")}</tbody></table><div class="row between" style="margin-top:15px"><strong>الإجمالي: ${money(total)}</strong><button class="orange" onclick="checkout()">تأكيد الطلب</button></div><div class="field" style="margin-top:15px"><label>عنوان التسليم</label><input id="deliveryAddress" placeholder="المنطقة والشارع ورقم المحل"></div><div class="field"><label>ملاحظات</label><input id="orderNotes" placeholder="موعد مناسب أو تفاصيل إضافية"></div>`:'<div class="empty">السلة فارغة. اذهب إلى المنتجات لإضافة أصناف.</div>'}</div>`}
function removeCart(id){cart=cart.filter(x=>x.id!==id);render()}
function checkout(){if(!cart.length)return;let address=document.getElementById("deliveryAddress").value.trim();if(!address){toast("من فضلك اكتب عنوان التسليم");return}let items=cart.map(x=>({...products.find(p=>p.id===x.id),qty:x.qty}));let total=items.reduce((s,x)=>s+x.price*x.qty,0);orders.push({id:"W"+Date.now().toString().slice(-7),customer:user.name,address,notes:document.getElementById("orderNotes").value,items,total,status:"جديد",date:new Date().toLocaleString("ar-EG")});save("orders",orders);cart=[];go("myorders");toast("تم تسجيل طلبك بنجاح")}
function ordersTable(arr,actions=true){if(!arr.length)return '<div class="empty">لا توجد طلبات لعرضها</div>';return `<div style="overflow:auto"><table><thead><tr><th>رقم الطلب</th><th>العميل</th><th>التاريخ</th><th>القيمة</th><th>الحالة</th>${actions?'<th>تحديث الحالة</th>':''}</tr></thead><tbody>${arr.map(o=>`<tr><td>${o.id}</td><td>${o.customer}</td><td>${o.date}</td><td>${money(o.total)}</td><td><span class="pill">${o.status}</span></td>${actions?`<td><select onchange="setStatus('${o.id}',this.value)">${["جديد","تم التأكيد","قيد التجهيز","خرج للتوصيل","تم التسليم","ملغي"].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join("")}</select></td>`:""}</tr>`).join("")}</tbody></table></div>`}
function setStatus(id,s){let o=orders.find(x=>x.id===id);if(o){o.status=s;save("orders",orders);render();toast("تم تحديث حالة الطلب")}}
function productsView(){return `<div class="panel"><h2>إضافة منتج جديد</h2><div class="row"><div class="field"><label>اسم المنتج</label><input id="pname" placeholder="مثال: زيت 1 لتر"></div><div class="field"><label>الشركة المصنعة</label><input id="pbrand" value="${user.role==="supplier"?user.name:""}" placeholder="اسم الشركة"></div><div class="field"><label>التصنيف</label><select id="pcat"><option>زيوت وسمن</option><option>مكرونة وأرز</option><option>شاي وسكر</option><option>بسكويت وسناكس</option><option>مشروبات</option><option>أخرى</option></select></div></div><div class="row"><div class="field"><label>سعر الكرتونة (جنيه)</label><input id="pprice" type="number" min="0"></div><div class="field"><label>وصف وحدة البيع</label><input id="punit" placeholder="كرتونة / 12 عبوة"></div><div class="field"><label>المخزون المتاح</label><input id="pstock" type="number" min="0" value="0"></div></div><button onclick="addProduct()">حفظ المنتج</button></div><div class="panel"><h2>الكتالوج الحالي</h2><div class="grid">${productCards(user.role==="supplier"?products.filter(p=>p.brand===user.name):products,false)}</div></div>`}
function addProduct(){let name=document.getElementById("pname").value.trim(),brand=document.getElementById("pbrand").value.trim(),price=Number(document.getElementById("pprice").value);if(!name||!brand||price<=0){toast("أكمل اسم المنتج والشركة والسعر");return}products.push({id:Date.now(),name,brand,category:document.getElementById("pcat").value,price,unit:document.getElementById("punit").value||"كرتونة",stock:Number(document.getElementById("pstock").value)||0,emoji:"📦"});save("products",products);render();toast("تمت إضافة المنتج")}
function usersView(){return `<div class="panel"><h2>المستخدمون والأدوار</h2><p class="muted">في النسخة التجريبية، يتم إنشاء جلسة المستخدم باختيار نوع الحساب من شاشة الدخول. التسجيل والتحقق الفعلي سيضافان في مرحلة ربط قاعدة البيانات.</p><table><thead><tr><th>نوع الحساب</th><th>الصلاحيات الأساسية</th></tr></thead><tbody><tr><td>مدير المنصة</td><td>إدارة المنتجات والطلبات ومتابعة المنصة</td></tr><tr><td>الشركة المصنعة</td><td>إدارة منتجاتها ومتابعة الطلبات</td></tr><tr><td>محل التجزئة</td><td>تصفح المنتجات وإنشاء الطلبات ومتابعتها</td></tr></tbody></table></div>`}
</script></body></html>
